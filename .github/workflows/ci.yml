name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Tests
        run: |
          xcodebuild \
            -project RealtimePriceTracker/RealtimePriceTracker.xcodeproj \
            -scheme RealTimePriceTracker \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            test
