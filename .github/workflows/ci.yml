name: iOS CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: ./RealTimePriceTracker

      - name: Build app
        run: |
          xcodebuild \
            -workspace RealTimePriceTracker.xcworkspace \
            -scheme RealtimePriceTracker \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            build

      - name: Run tests
        run: |
          xcodebuild \
            test \
            -workspace RealTimePriceTracker.xcworkspace \
            -scheme RealtimePriceTracker \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15'
