name: iOS Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify canonical toolchain and simulator
        run: |
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}; architecture: ${RUNNER_ARCH:-unknown}"
          echo "DEVELOPER_DIR: $DEVELOPER_DIR"
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          if [[ "$xcode_version" != $'Xcode 27.2\nBuild version 27B52' ]]; then
            echo 'Expected Xcode 27.2 build 27B52.' >&2
            exit 1
          fi
          swift_version="$(xcrun swift --version)"
          printf '%s\n' "$swift_version"
          if [[ "$swift_version" != *'Apple Swift version 6.4.2'* ]]; then
            echo 'Expected Apple Swift 6.4.2.' >&2
            exit 1
          fi
          xcodebuild -showsdks
          for sdk in iphoneos iphonesimulator; do
            sdk_version="$(xcrun --sdk "$sdk" --show-sdk-version)"
            if [[ "$sdk_version" != '27.2' ]]; then
              echo "Expected $sdk SDK 27.2; found $sdk_version." >&2
              exit 1
            fi
          done
          xcrun simctl list runtimes
          destinations="$(xcodebuild -showdestinations \
            -project RealTimePriceTracker/RealTimePriceTracker.xcodeproj \
            -scheme RealTimePriceTracker \
            -onlyUsePackageVersionsFromResolvedFile)"
          printf '%s\n' "$destinations"
          if [[ "$destinations" != *'OS:27.2, name:iPhone 18 Pro'* ]]; then
            echo 'Expected iPhone 18 Pro simulator on iOS 27.2.' >&2
            exit 1
          fi
          jq -e '([.pins[] | {identity, version: .state.version}] | sort_by(.identity)) ==
                 [{"identity":"swift-algorithms","version":"1.2.1"},
                  {"identity":"swift-numerics","version":"1.1.1"}]' \
            RealTimePriceTracker/RealTimePriceTracker.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Prepare result bundle path
        id: result_bundle
        run: |
          printf 'path=%s/RealTimePriceTracker-%s-%s.xcresult\n' \
            "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        id: tests
        env:
          RESULT_BUNDLE: ${{ steps.result_bundle.outputs.path }}
        run: |
          xcodebuild test \
            -project RealTimePriceTracker/RealTimePriceTracker.xcodeproj \
            -scheme RealTimePriceTracker \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.2' \
            -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath "$RESULT_BUNDLE" \
            -parallel-testing-enabled NO \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Summarize test results
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        env:
          RESULT_BUNDLE: ${{ steps.result_bundle.outputs.path }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          summary_json="$RUNNER_TEMP/xcode-test-summary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"

          if [[ ! -d "$RESULT_BUNDLE" ]]; then
            printf '### Xcode test results\n\nNo result bundle was generated.\n' >> "$GITHUB_STEP_SUMMARY"
            if [[ "$TEST_OUTCOME" == 'success' ]]; then exit 1; fi
            exit 0
          fi

          if ! xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE" > "$summary_json"; then
            printf '### Xcode test results\n\nTest summary extraction failed.\n' >> "$GITHUB_STEP_SUMMARY"
            if [[ "$TEST_OUTCOME" == 'success' ]]; then exit 1; fi
            exit 0
          fi

          if ! jq -e '(.totalTestCount | type == "number") and
                      (.passedTests | type == "number") and
                      (.failedTests | type == "number") and
                      (.skippedTests | type == "number")' "$summary_json" > /dev/null; then
            printf '### Xcode test results\n\nTest counts were unavailable.\n' >> "$GITHUB_STEP_SUMMARY"
            if [[ "$TEST_OUTCOME" == 'success' ]]; then exit 1; fi
            exit 0
          fi

          read -r total passed failed skipped < <(jq -r '[.totalTestCount, .passedTests, .failedTests, .skippedTests] | @tsv' "$summary_json")
          printf 'Test results: total=%s passed=%s failed=%s skipped=%s\n' "$total" "$passed" "$failed" "$skipped"
          {
            printf '### Xcode test results\n\n'
            printf '| Total | Passed | Failed | Skipped |\n'
            printf '| ---: | ---: | ---: | ---: |\n'
            printf '| %s | %s | %s | %s |\n' "$total" "$passed" "$failed" "$skipped"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Xcode result bundle
        if: ${{ always() && steps.tests.outcome != 'skipped' && steps.result_bundle.outputs.path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: xcode-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.result_bundle.outputs.path }}
          if-no-files-found: warn
          retention-days: 14
